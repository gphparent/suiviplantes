name: Envoi vers TestFlight

# Declenchement manuel uniquement.
#
# Ce n'est pas un detail : le depot est public, donc n'importe qui peut y
# proposer une modification. Un workflow declenche par une poussee ou une
# demande de tirage exposerait la mecanique de signature a du code venu de
# l'exterieur. `workflow_dispatch` exige un droit d'ecriture sur le depot.
#
# GitHub ne transmet jamais les secrets aux workflows lances depuis une
# bifurcation, mais s'appuyer sur cette garantie plutot que sur le declencheur
# serait une precaution de moins pour rien.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Note pour les testeurs (facultatif)"
        required: false
        type: string

jobs:
  televerser:
    name: Archiver et envoyer
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les secrets sont en place
        env:
          CLE: ${{ secrets.ASC_PRIVATE_KEY }}
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
          EMETTEUR: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          manquants=""
          [ -n "$CLE" ]         || manquants="$manquants ASC_PRIVATE_KEY"
          [ -n "$IDENTIFIANT" ] || manquants="$manquants ASC_KEY_ID"
          [ -n "$EMETTEUR" ]    || manquants="$manquants ASC_ISSUER_ID"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants"
            echo "A deposer dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Les trois secrets indispensables sont presents."
          # Le quatrieme, ASC_TEAM_ID, est facultatif : l'etape suivante sait le
          # demander a Apple quand il n'est pas fourni.

      - name: Deposer la cle d'API
        env:
          CLE: ${{ secrets.ASC_PRIVATE_KEY }}
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
        run: |
          # `altool` cherche la cle a cet emplacement precis, sous ce nom precis.
          mkdir -p ~/private_keys
          printf '%s\n' "$CLE" > ~/private_keys/AuthKey_${IDENTIFIANT}.p8
          chmod 600 ~/private_keys/AuthKey_${IDENTIFIANT}.p8

      - name: Determiner l'equipe
        id: equipe
        env:
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
          EMETTEUR: ${{ secrets.ASC_ISSUER_ID }}
          FOURNI: ${{ secrets.ASC_TEAM_ID }}
        run: |
          if [ -n "$FOURNI" ]; then
            echo "Team ID fourni par le secret ASC_TEAM_ID."
            echo "id=$FOURNI" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le Team ID ne se trouve pas sur la meme page que la cle, et il
          # s'oublie. Plutot que d'echouer, on le demande a Apple : la cle
          # d'API donne acces a la liste des equipes auxquelles elle est
          # rattachee, et le nom court d'une equipe est son Team ID.
          echo "ASC_TEAM_ID absent : recherche aupres d'Apple."
          xcrun altool --list-providers             --apiKey "$IDENTIFIANT" --apiIssuer "$EMETTEUR"             --output-format json > equipes.json || {
              echo "La consultation a echoue. Verifiez la cle, ou fournissez"
              echo "ASC_TEAM_ID : developer.apple.com/account, Membership details."
              exit 1
            }
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          donnees = json.load(open('equipes.json'))
          equipes = donnees.get('providers') or donnees.get('Providers') or []
          # Un Team ID fait dix caracteres alphanumeriques majuscules.
          motif = re.compile(r'^[A-Z0-9]{10}$')
          trouves = []
          for e in equipes:
              for cle in ('ProviderShortname', 'providerShortname', 'ShortName'):
                  valeur = e.get(cle)
                  if valeur and motif.match(str(valeur)):
                      trouves.append((str(valeur), e.get('ProviderName') or e.get('providerName') or '?'))
                      break
          if len(trouves) == 1:
              print(f"id={trouves[0][0]}")
              print(f"Equipe retenue : {trouves[0][1]} ({trouves[0][0]})", file=sys.stderr)
          elif not trouves:
              print("La cle n'est rattachee a aucune equipe exploitable.", file=sys.stderr)
              print("Deposez ASC_TEAM_ID : developer.apple.com/account,", file=sys.stderr)
              print("section Membership details, ligne Team ID.", file=sys.stderr)
              sys.exit(1)
          else:
              print("Plusieurs equipes, impossible de choisir seul :", file=sys.stderr)
              for ident, nom in trouves:
                  print(f"  {ident}  {nom}", file=sys.stderr)
              print("Deposez ASC_TEAM_ID avec celle qui porte l'app.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Archiver
        env:
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
          EMETTEUR: ${{ secrets.ASC_ISSUER_ID }}
          EQUIPE: ${{ steps.equipe.outputs.id }}
        run: |
          set -o pipefail
          # `-allowProvisioningUpdates` avec une cle d'API laisse Xcode creer
          # lui-meme le certificat de distribution et le profil. C'est ce qui
          # remplace le passage par le Trousseau d'un Mac.
          xcodebuild archive \
            -project Serre.xcodeproj \
            -scheme Serre \
            -destination 'generic/platform=iOS' \
            -archivePath build/Serre.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${IDENTIFIANT}.p8 \
            -authenticationKeyID "$IDENTIFIANT" \
            -authenticationKeyIssuerID "$EMETTEUR" \
            DEVELOPMENT_TEAM="$EQUIPE" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee archive.log

      - name: Preparer les options d'export
        env:
          EQUIPE: ${{ steps.equipe.outputs.id }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${EQUIPE}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

      - name: Exporter l'archive
        env:
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
          EMETTEUR: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Serre.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${IDENTIFIANT}.p8 \
            -authenticationKeyID "$IDENTIFIANT" \
            -authenticationKeyIssuerID "$EMETTEUR" \
            | tee export.log
          ls -la build/export

      - name: Envoyer vers App Store Connect
        env:
          IDENTIFIANT: ${{ secrets.ASC_KEY_ID }}
          EMETTEUR: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          IPA=$(find build/export -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "Aucun .ipa produit"; exit 1; }
          echo "Envoi de $IPA"
          # Validation d'abord : elle attrape la plupart des refus avant
          # l'envoi, et coute quelques secondes.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$IDENTIFIANT" --apiIssuer "$EMETTEUR"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$IDENTIFIANT" --apiIssuer "$EMETTEUR"

      - name: Effacer la cle
        if: always()
        run: rm -rf ~/private_keys

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-envoi
          path: |
            archive.log
            export.log
            equipes.json
          retention-days: 14
