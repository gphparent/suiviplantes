name: Envoi vers TestFlight

# Declenchement manuel uniquement. Le depot est public : un declencheur par
# poussee exposerait la mecanique de signature a du code venu de l'exterieur.
# `workflow_dispatch` exige un droit d'ecriture sur le depot.
on:
  workflow_dispatch:

jobs:
  televerser:
    name: Archiver et envoyer
    runs-on: macos-latest

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Le depot Vitamine-D nomme ce secret APPLE_TEAM_ID. Les deux sont
      # acceptes, pour qu'une meme cle serve aux deux projets sans renommage.
      APPLE_TEAM_ID: ${{ secrets.ASC_TEAM_ID || secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Verifier que les secrets sont en place
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          manquants=""
          [ -n "$ASC_PRIVATE_KEY" ] || manquants="$manquants ASC_PRIVATE_KEY"
          [ -n "$ASC_KEY_ID" ]      || manquants="$manquants ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ]   || manquants="$manquants ASC_ISSUER_ID"
          [ -n "$APPLE_TEAM_ID" ]   || manquants="$manquants ASC_TEAM_ID"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants"
            echo "A deposer dans Settings > Secrets and variables > Actions."
            echo
            echo "Le plus simple est de reprendre exactement les valeurs qui"
            echo "servent deja au depot vitamine-d : elles sont eprouvees."
            exit 1
          fi
          echo "Les quatre secrets sont presents."

      - name: Deposer la cle d'API
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # xcodebuild attend la cle sous ce nom precis. Elle vit dans le
          # dossier temporaire de l'executeur, detruit avec la machine.
          mkdir -p "$RUNNER_TEMP/private_keys"
          FICHIER="$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$FICHIER"
          chmod 600 "$FICHIER"

          # Controle de forme, sans jamais afficher la cle.
          souci=0
          head -1 "$FICHIER" | grep -q 'BEGIN PRIVATE KEY' || {
            echo "ASC_PRIVATE_KEY ne commence pas par -----BEGIN PRIVATE KEY-----"; souci=1; }
          openssl pkey -in "$FICHIER" -noout 2>/dev/null || {
            echo "La cle privee est illisible : contenu tronque ou altere."; souci=1; }
          [ "${#ASC_KEY_ID}" -eq 10 ] || {
            echo "ASC_KEY_ID fait ${#ASC_KEY_ID} caracteres, 10 attendus."; souci=1; }
          [ "${#ASC_ISSUER_ID}" -eq 36 ] || {
            echo "ASC_ISSUER_ID fait ${#ASC_ISSUER_ID} caracteres, 36 attendus."; souci=1; }
          [ "$souci" -eq 0 ] || exit 1
          echo "Cle et identifiants bien formes."

      - name: Eprouver les identifiants aupres d'Apple
        run: |
          # Xcode signale un refus 401 au milieu de l'archivage sans dire
          # laquelle des trois valeurs est en cause. Un appel direct le dit en
          # une seconde, et confirme que la fiche est visible par la cle.
          python3 Tools/tester-cle-asc.py \
            "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" ca.serre

      - name: Archiver, signe si possible
        run: |
          set -o pipefail
          # Deux chemins, essayes dans l'ordre, parce que le bon depend d'une
          # chose qui ne vit pas dans ce depot : la presence d'un appareil
          # enregistre dans le compte developpeur. Sans appareil, Apple refuse
          # de generer un profil de developpement et la signature echoue.
          #
          # Le repli sans signature est ici sans consequence : Serre ne declare
          # aucun droit particulier. Ce serait different si WeatherKit etait
          # active — l'archive non signee n'aurait alors aucun droit a
          # transmettre a l'export.
          #
          # Le numero de version interne doit croitre a chaque televersement,
          # sans quoi Apple refuse le paquet comme doublon.
          commun=(
            -project Serre.xcodeproj
            -scheme Serre
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "$RUNNER_TEMP/Serre.xcarchive"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          )

          if xcodebuild archive "${commun[@]}" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic; then
            echo "Archive signee."
          else
            echo "::warning::Signature de l'archive impossible — probablement"
            echo "::warning::aucun appareil enregistre dans le compte."
            echo "::warning::Repli sans signature. Sans droits declares, la"
            echo "::warning::version reste complete."
            rm -rf "$RUNNER_TEMP/Serre.xcarchive"
            xcodebuild archive "${commun[@]}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Televerser sur TestFlight
        run: |
          set -o pipefail
          # `destination: upload` fait envoyer l'archive directement a App
          # Store Connect par xcodebuild, sans passer par un outil tiers.
          # `manageAppVersionAndBuildNumber` a faux empeche Xcode de reecrire
          # le numero de version qu'on vient de fixer.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Serre.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Version $GITHUB_RUN_NUMBER envoyee. Apple met dix a trente"
          echo "minutes a la traiter avant qu'elle apparaisse dans TestFlight."

      - name: Effacer la cle
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
